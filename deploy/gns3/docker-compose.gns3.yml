services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mango-gns3-net

  vpn-gateway:
    build:
      context: ../..
      dockerfile: Sobree/vpn-daemon/Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      DAEMON_LISTEN_ADDR: 0.0.0.0:50051
      DAEMON_SHARED_SECRET: ${DAEMON_SHARED_SECRET:?Set DAEMON_SHARED_SECRET}
      WG_INTERFACE: ${WG_INTERFACE:-wg0}
      WG_LISTEN_PORT: ${WG_LISTEN_PORT:-51820}
      WG_GATEWAY_CIDR: ${WG_GATEWAY_CIDR:-10.13.13.1/24}
      WG_PRIVATE_KEY: ${WG_PRIVATE_KEY:?Set WG_PRIVATE_KEY}
      FORTIGATE_API_URL: ${FORTIGATE_API_URL:-}
      FORTIGATE_API_TOKEN: ${FORTIGATE_API_TOKEN:-}
      CISCO_API_URL: ${CISCO_API_URL:-}
      CISCO_API_TOKEN: ${CISCO_API_TOKEN:-}
    ports:
      - "${WG_LISTEN_PORT:-51820}:51820/udp"
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      set -eu;
      nft list table inet mango_vpn >/dev/null 2>&1 ||
        nft add table inet mango_vpn;
      nft list chain inet mango_vpn forward >/dev/null 2>&1 ||
        nft add chain inet mango_vpn forward '{ type filter hook forward priority 0 ; policy drop ; }';
      exec /usr/local/bin/vpn-daemon
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:50051/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      mango-gns3-net:
        ipv4_address: 172.29.0.10

  api:
    build:
      context: ../..
      dockerfile: Sobree/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET:?Set REFRESH_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY}
      DAEMON_SHARED_SECRET: ${DAEMON_SHARED_SECRET:?Set DAEMON_SHARED_SECRET}
      VPN_DAEMON_URL: http://vpn-gateway:50051
      WG_SERVER_PUBLIC_KEY: ${WG_SERVER_PUBLIC_KEY:?Set WG_SERVER_PUBLIC_KEY}
      WG_SERVER_ENDPOINT: ${WG_SERVER_ENDPOINT:-203.0.113.10:51820}
      WG_DNS: ${WG_DNS:-1.1.1.1}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://vpn.mango.lab}
    depends_on:
      postgres:
        condition: service_healthy
      vpn-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - mango-gns3-net

  portal:
    build:
      context: ../..
      dockerfile: Rain/portal/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://vpn.mango.lab}
      VITE_AGENT_URL: http://127.0.0.1:47821
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mango-gns3-net

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.gns3:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - portal
    networks:
      - mango-gns3-net

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  mango-gns3-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
