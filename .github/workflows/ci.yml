name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main", "feature/**" ]

jobs:
  guardrails-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mango
          POSTGRES_PASSWORD: mangosecret
          POSTGRES_DB: mangovpn
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Security & Anti-Mock Guardrails
        run: node scripts/check-guardrails.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://mango:mangosecret@localhost:5432/mangovpn?schema=public

      - name: Apply Prisma Migrations
        run: npx prisma migrate deploy --schema=Sobree/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://mango:mangosecret@localhost:5432/mangovpn?schema=public

      - name: Build All TypeScript Workspaces
        run: npm run build

      - name: Run Monorepo Tests
        run: npm test --if-present
        env:
          DATABASE_URL: postgresql://mango:mangosecret@localhost:5432/mangovpn?schema=public

      - name: Vet & Build Go Agent (Windows)
        working-directory: Sobree/agent-windows
        run: |
          if [ -f go.mod ]; then
            GOOS=windows go vet ./...
            GOOS=windows go build ./...
          fi

      - name: Vet & Test Go VPN Daemon (Linux)
        working-directory: Sobree/vpn-daemon
        run: |
          if [ -f go.mod ]; then
            go vet ./...
            go test ./...
            go build ./...
          fi

  windows-agent-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet, Test & Build Go Agent (Windows)
        working-directory: Sobree/agent-windows
        run: |
          go vet ./...
          go test ./...
          go build ./...
