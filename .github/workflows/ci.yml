name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mango
          POSTGRES_PASSWORD: mangosecret
          POSTGRES_DB: mangovpn
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npm --workspace=@mango/api run prisma:generate
        env:
          DATABASE_URL: postgresql://mango:mangosecret@localhost:5432/mangovpn?schema=public

      - name: Typecheck Shared Contracts
        run: npm --workspace=@mango/shared run build

      - name: Typecheck Rain Admin Module
        run: npm --workspace=@mango/rain-admin run build

      - name: Typecheck Sobree API
        run: npm --workspace=@mango/api run build

      - name: Typecheck & Build Rain Portal UI
        run: npm --workspace=@mango/portal run build
