services:
  postgres:
    image: postgres:16-alpine
    container_name: mango-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mango}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mangosecret}
      POSTGRES_DB: ${POSTGRES_DB:-mangovpn}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mango} -d ${POSTGRES_DB:-mangovpn}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mango-net

  vpn-gateway:
    image: linuxserver/wireguard:latest
    container_name: mango-vpn-gateway
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SERVERURL=127.0.0.1
      - SERVERPORT=51820
      - PEERS=0
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0/24
      - ALLOWEDIPS=0.0.0.0/0
      - LOG_CONFS=true
    ports:
      - "51820:51820/udp"
    volumes:
      - wireguard_config:/config
      - /lib/modules:/lib/modules:ro
    networks:
      - mango-net

  api:
    build:
      context: .
      dockerfile: Sobree/api/Dockerfile
    container_name: mango-api
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mango}:${POSTGRES_PASSWORD:-mangosecret}@postgres:5432/${POSTGRES_DB:-mangovpn}?schema=public
      - JWT_SECRET=mango-vpn-jwt-insecure-secret-key-32chars
      - JWT_EXPIRES_IN=3600s
      - REFRESH_SECRET=mango-vpn-refresh-token-insecure-secret
      - REFRESH_EXPIRES_IN=7d
      - WG_SERVER_PUBLIC_KEY=bmFub01hbmdvV2lyZUd1YXJkU2VydmVyUHVibGljS2V5PQ==
      - WG_SERVER_ENDPOINT=127.0.0.1:51820
      - WG_SERVER_ALLOWED_IPS=10.13.13.0/24
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mango-net

  portal:
    build:
      context: .
      dockerfile: Rain/portal/Dockerfile
    container_name: mango-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - api
    networks:
      - mango-net

volumes:
  postgres_data:
  wireguard_config:

networks:
  mango-net:
    driver: bridge
